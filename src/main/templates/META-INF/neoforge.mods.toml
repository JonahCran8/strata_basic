modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="jonah"
description='''
Strata Basic: the layered world of Strata and nothing else. Five layers (stone, deepslate, lithoslate, mantleslate, ferrite) with the Nether
(the Nether) under them, four layer creepers, the layer stones and their blocks, vanilla ores in every layer, and vanilla Nether
fortresses and bastions in the Nether.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

# Optional: load after YUNG's Better Nether Fortresses so our data override of its fortress wins
[[dependencies.${mod_id}]]
    modId="betterfortresses"
    type="optional"
    versionRange="[1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
